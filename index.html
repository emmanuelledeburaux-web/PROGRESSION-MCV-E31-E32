<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Emmanuelle Deburaux">
<title>Grille MCV E31 E32 — Emmanuelle Deburaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">
/* Layout : barre d'onglets en haut, grille large défilante (noms figés à gauche), fiches en colonne lisible. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#F8F9F6; --ink:#1B2024; --ink-soft:#4C565E; --ink-faint:#7E8890;
  --line:#DADDD6; --line-strong:#B9BDB4; --focus:#1D7A86;
  --e31:#12384A; --e31-tint:#E3ECF0; --e32:#5A1F33; --e32-tint:#F2E6EA;
  /* niveaux (image fournie) */
  --n1:#C8531F; --n2:#1F4E9A; --n3:#3D7A2A; --n4:#5B2C8C; --nx:#8A9097; --on-level:#FFFFFF;
  --empty:#EEF0EB; --gold:#C89A12;
  --warn-bg:#FBEBDD; --warn-ink:#9A3F12;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,30,35,.06),0 10px 30px -14px rgba(20,30,35,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181B; --surface:#1C2125; --surface-2:#20262B; --ink:#EEF1F2; --ink-soft:#B6BEC4; --ink-faint:#86909A;
  --line:#2E363C; --line-strong:#46515A; --focus:#5BC0CC;
  --e31:#2C6A86; --e31-tint:#1B2C35; --e32:#8E3A55; --e32-tint:#2F1E25;
  --n1:#D9622C; --n2:#3A6CC2; --n3:#4C9434; --n4:#7A4AB0; --nx:#69717A; --empty:#252B30;
  --warn-bg:#3A2416; --warn-ink:#F2A579; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181B; --surface:#1C2125; --surface-2:#20262B; --ink:#EEF1F2; --ink-soft:#B6BEC4; --ink-faint:#86909A;
  --line:#2E363C; --line-strong:#46515A; --focus:#5BC0CC;
  --e31:#2C6A86; --e31-tint:#1B2C35; --e32:#8E3A55; --e32-tint:#2F1E25;
  --n1:#D9622C; --n2:#3A6CC2; --n3:#4C9434; --n4:#7A4AB0; --nx:#69717A; --empty:#252B30;
  --warn-bg:#3A2416; --warn-ink:#F2A579; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:18px 60px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* En-tête */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.top h1{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800}
.top .sub{color:var(--ink-soft);font-size:.92rem}
.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savestate{font-size:.85rem;color:var(--ink-soft)}
.savestate.dirty{color:var(--warn-ink);font-weight:700}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:disabled{opacity:.35;cursor:default}
.btn.small{padding:4px 10px;font-size:.82rem;border-radius:8px}
.btn.danger{color:var(--n1);border-color:var(--n1)}

/* Onglets */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* Légende des niveaux */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem}
.lv{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.dot{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--on-level);font-weight:700;font-size:.92rem;flex:none;font-variant-numeric:tabular-nums}
.l1{background:var(--n1)} .l2{background:var(--n2)} .l3{background:var(--n3)} .l4{background:var(--n4)}
.lx{background:var(--nx)}
.t1{color:var(--n1)} .t2{color:var(--n2)} .t3{color:var(--n3)} .t4{color:var(--n4)}
.pill{display:inline-grid;place-items:center;min-width:38px;height:22px;padding:0 6px;border-radius:6px;background:var(--nx);color:var(--on-level);font-size:.72rem;font-weight:700;letter-spacing:.04em}

/* Filtres */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:3px}
.hint{font-size:.82rem;color:var(--ink-faint)}

/* Grille */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:78vh;box-shadow:var(--shadow)}
table.grid{border-collapse:separate;border-spacing:0;font-size:.8rem}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.grid thead th{position:sticky;z-index:2}
.grid thead tr.r-bloc th{top:0;height:34px}
.grid thead tr.r-comp th{top:34px;height:44px}
.grid thead tr.r-sav th{top:78px;height:74px}
.grid thead tr.r-trav th{top:152px;height:150px}
.grid .namecol{position:sticky;left:0;z-index:3;background:var(--surface);min-width:190px;max-width:190px;text-align:left;padding:0 10px;font-weight:700;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid thead .namecol{z-index:5;background:var(--surface-2);color:var(--ink-faint);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.h-bloc{color:#fff;font-family:var(--font-display);font-size:.98rem;text-align:left;padding:0 12px!important;white-space:nowrap}
.h-bloc span{position:sticky;left:200px}
.h-comp{color:#fff;font-weight:700;text-align:left;padding:4px 10px!important;font-size:.8rem;line-height:1.2}
.h-comp b{font-family:var(--font-display);font-size:.95rem;margin-right:6px}
.h-sav{font-size:.72rem;line-height:1.2;font-weight:700;padding:4px 5px!important;text-align:center;vertical-align:middle;color:var(--ink)}
.h-sav.one{font-size:.66rem;padding:3px!important}
.h-sav div{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;hyphens:auto}
.h-trav{vertical-align:bottom;background:var(--surface);width:68px;min-width:68px;max-width:68px}
.h-trav div{writing-mode:vertical-rl;transform:rotate(180deg);height:142px;padding:6px 0;margin:0 auto;font-size:.76rem;font-weight:700;line-height:1.15;text-align:left;overflow:hidden;display:block}
.h-trav.prop div{font-style:italic;color:var(--ink-faint)}
.h-syn{color:#fff;font-size:.7rem;font-weight:700;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 0!important;width:50px;min-width:50px}
td.cell{width:68px;min-width:68px;height:40px;text-align:center}
td.cell button{width:100%;height:100%;border:0;background:transparent;display:grid;place-items:center;padding:0}
td.cell button:hover{background:var(--surface-2)}
td.cell .empty{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--line-strong)}
td.syn{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;width:50px;min-width:50px;font-size:.82rem}
td.syn.blocsyn{background:var(--surface-2)}
tr:hover td.cell,tr:hover td.syn,tr:hover .namecol{background-image:linear-gradient(rgba(127,140,150,.08),rgba(127,140,150,.08))}
.avg{display:inline-block;min-width:36px;padding:3px 6px;border-radius:6px;color:var(--on-level)}
tfoot td{background:var(--surface-2);font-weight:700;position:sticky;bottom:0;z-index:1;height:34px;text-align:center;font-size:.78rem}
tfoot .namecol{z-index:4;background:var(--surface-2)!important}

/* Menu de saisie */
.picker{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:grid;gap:4px;min-width:200px}
.picker .ptitle{font-size:.74rem;color:var(--ink-faint);padding:2px 6px 6px;border-bottom:1px solid var(--line);margin-bottom:2px;max-width:230px}
.picker button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:5px 8px;border-radius:8px;text-align:left;font-weight:700;font-size:.88rem}
.picker button:hover,.picker button:focus-visible{background:var(--surface-2)}
.picker kbd{margin-left:auto;font-size:.7rem;color:var(--ink-faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}

/* Cartes / fiches */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sel{border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 12px;background:var(--surface);font-weight:700;min-width:240px;max-width:100%}
.blocs2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.blocard{border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.blocard.E31{background:var(--e31-tint);border:2px solid var(--e31)}
.blocard.E32{background:var(--e32-tint);border:2px solid var(--e32)}
.blochead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.blochead h3{font-size:1.15rem}
.bigstats{display:flex;gap:20px;flex-wrap:wrap}
.bigstat b{display:block;font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.bigstat span{font-size:.76rem;color:var(--ink-soft)}
.scale{position:relative;height:14px;border-radius:7px;display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.scale i{display:block}
.scale-wrap{position:relative;padding-top:4px}
.marker{position:absolute;top:-3px;width:4px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.scale-lbl{display:grid;grid-template-columns:repeat(4,1fr);font-size:.66rem;font-weight:700;margin-top:4px;text-align:center}
.comprow{display:grid;grid-template-columns:minmax(0,1.3fr) 80px minmax(0,1fr);gap:10px;align-items:center;font-size:.86rem}
.comprow .cname{display:flex;gap:8px;align-items:center;min-width:0}
.cbadge{color:#fff;font-weight:700;border-radius:6px;padding:2px 7px;font-size:.76rem;flex:none}
.dist{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--empty)}
.dist i{display:block;height:100%}
.compsec{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.compsec > header{color:#fff;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.compsec > header h3{font-size:1rem}
.savsec{padding:8px 14px 12px;border-top:1px solid var(--line)}
.savsec h4{margin:4px 0 6px;font-size:.84rem;display:flex;gap:8px;align-items:center}
.savsec h4 .sw{width:10px;height:10px;border-radius:3px;flex:none}
.travline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:.88rem}
.travline:first-of-type{border-top:0}
.levtag{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:.82rem;white-space:nowrap}
.self{display:flex;gap:3px}
.self button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:.78rem;padding:0}
.self button[aria-pressed="true"]{color:var(--on-level);border-color:transparent}
.self button[aria-pressed="true"][data-v="1"]{background:var(--n1)}
.self button[aria-pressed="true"][data-v="2"]{background:var(--n2)}
.self button[aria-pressed="true"][data-v="3"]{background:var(--n3)}
.self button[aria-pressed="true"][data-v="4"]{background:var(--n4)}
.todo{background:var(--warn-bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.todo h3{font-size:1rem;color:var(--warn-ink)}
.todo ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.note{font-size:.8rem;color:var(--ink-faint)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.syn{border-collapse:collapse;font-size:.84rem;width:100%;min-width:760px}
table.syn th,table.syn td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
table.syn th{font-size:.74rem;color:#fff}
table.syn td:first-child,table.syn th:first-child{text-align:left}
.alert{color:var(--n1);font-weight:700}
.repart{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 24px}
.repart .comprow{grid-template-columns:110px minmax(0,1fr) 34px}

/* Réglages */
.tree{display:flex;flex-direction:column;gap:14px}
.edcomp{border:1px solid var(--line);border-left:6px solid;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.edsav{background:var(--surface-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.edline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edline input[type=text]{flex:1;min-width:180px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;background:var(--surface)}
.edline input.sav{font-weight:700}
.edline label{font-size:.8rem;color:var(--ink-soft)}
.num{width:70px;border:1px solid var(--line-strong);border-radius:8px;padding:6px;background:var(--surface)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;color:var(--n1);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;font-size:.9rem;max-width:calc(100% - 32px)}
.banner{border:1.5px solid var(--n2);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
/* Outils de saisie */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-weight:700;font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.h-trav button{all:unset;cursor:pointer;display:block;width:100%;height:100%}
.h-trav button:hover{background:var(--surface-2)}
.h-trav button:focus-visible{outline:2.5px solid var(--focus);outline-offset:-3px}
td.cell button{position:relative}
.cdot{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ink-soft)}
.picker textarea{width:100%;min-height:54px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;background:var(--surface-2);font-size:.84rem;resize:vertical}
.picker .plabel{font-size:.72rem;color:var(--ink-faint);padding:6px 6px 2px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.picker .pwarn{font-size:.84rem;padding:4px 6px;max-width:240px}
/* Profil joueur (repris CAP EPC) */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 20px;align-items:center}
.avatar{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;font:800 1.7rem var(--font-display);color:#fff;position:relative;background:var(--e31)}
.avatar .lvl{position:absolute;bottom:-8px;right:-10px;background:var(--gold);color:#1b1f33;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;border:2px solid var(--surface);white-space:nowrap}
.hero h2{font-size:1.6rem}
.rank{font-weight:700;color:var(--ink-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xpbar{height:14px;border-radius:999px;background:var(--empty);overflow:hidden;margin-top:8px;max-width:560px}
.xpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--e31),var(--n4))}
.xpmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-faint);max-width:560px;margin-top:3px;font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:8px}
.badge{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);opacity:.6}
.badge.on{opacity:1;background:var(--surface);border-color:var(--gold)}
.badge b{display:block;font-size:.86rem}
.badge small{display:block;font-size:.74rem;color:var(--ink-faint);line-height:1.3}
.gap{font-size:.74rem;font-weight:700}
.gap.ok{color:var(--n3)} .gap.over{color:var(--n1)} .gap.under{color:var(--n2)}
.prog{font-size:.74rem;color:var(--ink-faint);font-weight:700}
.com{grid-column:1/-1;font-size:.84rem;color:var(--ink-soft);background:var(--surface-2);border-radius:8px;padding:5px 9px}
.selfcol{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.blindbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line-strong);border-radius:12px;padding:10px 12px;font-size:.88rem}
textarea.paste{width:100%;min-height:110px;border:1px solid var(--line-strong);border-radius:8px;padding:8px;background:var(--surface)}
/* Grille inversée : travaux en lignes, élèves en colonnes */
table.tgrid{border-collapse:separate;border-spacing:0;font-size:.82rem}
.tgrid th,.tgrid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.tgrid thead th{position:sticky;top:0;z-index:3;background:var(--surface);vertical-align:bottom}
.tgrid th.corner{left:0;z-index:5;min-width:300px;max-width:300px;text-align:left;padding:10px 12px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);background:var(--surface-2)}
.tgrid th.corner span{color:var(--ink-soft)}
.tgrid th.stu{width:44px;min-width:44px;max-width:44px;height:150px}
.tgrid th.stu div{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto;padding:8px 0;font-weight:700;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:144px}
.tgrid th.stu.hc{background:var(--ink);color:var(--bg)}
.tgrid th.avgh{background:var(--surface-2);width:58px;min-width:58px}
.tgrid tr.r-bloc td,.tgrid tr.r-comp td,.tgrid tr.r-sav td{height:auto}
.tgrid .stick{position:sticky;left:12px;display:inline-block;padding:6px 0;max-width:min(80vw,900px)}
.tgrid tr.r-bloc td{color:#fff;font-family:var(--font-display);font-size:1rem;font-weight:800;padding:2px 12px}
.tgrid tr.r-comp td{color:#fff;font-weight:700;padding:0 12px}
.tgrid tr.r-comp b{font-family:var(--font-display);font-size:.98rem;margin-right:4px}
.tgrid tr.r-sav td{font-weight:700;font-size:.78rem;padding:0 12px;color:var(--ink)}
.tgrid th.trav{position:sticky;left:0;z-index:2;background:var(--surface);min-width:300px;max-width:300px;text-align:left;padding:4px 6px 4px 12px;font-weight:700;font-size:.82rem;line-height:1.25}
.tgrid th.trav{display:table-cell}
.tgrid th.trav .ttl{display:inline-block;width:calc(100% - 34px);vertical-align:middle}
.tgrid th.trav.prop .ttl{font-style:italic;color:var(--ink-faint)}

  return '<div class="banner"><span><b>Enregistrement automatique dans « '+esc(ui.fh.name)+' ».</b> Pour reprendre votre travail, rouvrez ce fichier-là (et non l\'ancien téléchargement). « Version élèves » crée un fichier en lecture seule pour l\'ENT.</span><button class="btn small" data-act="linkfile">Changer de fichier</button></div>';}

  ui.needPerm=false;var nx=JSON.parse(JSON.stringify(S));nx.updated=S.updated||new Date().toISOString();var w=await ui.fh.createWritable();await w.write(buildFileDoc(nx));await w.close();ui.fileSaved=hhmm();ui.fileDirty=false;return true;}catch(e){ui.fileErr=String(e&&e.message||e);return false;}}
async function linkFile(){if(!FSA){download('Grille_MCV_E31_E32_'+slugName()+'.html',buildFileDoc(S));return;}
  try{var fh=await window.showSaveFilePicker({suggestedName:'Grille_MCV_E31_E32_'+String(S.classe||'classe').replace(/[^A-Za-z0-9]+/g,'_')+'.html',types:[{description:'Page HTML',accept:{'text/html':['.html']}}]});ui.fh=fh;idb('put',fh);var ok=await writeFile(true);render();toast(ok?'Grille enregistrée dans « '+fh.name+' » : rouvrez ce fichier la prochaine fois':'Écriture impossible dans ce fichier');}catch(e){if(e&&e.name!=='AbortError')toast('Enregistrement annulé : '+(e.message||e));}}
var fileT=null;function scheduleFile(){ui.fileDirty=true;clearTimeout(fileT);if(ui.fh&&!ui.needPerm)fileT=setTimeout(function(){writeFile(false).then(function(){updateSaveBar();var b=document.querySelector('.banner');if(ui.needPerm)render();});},1500);}
function buildDoc(state){var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return SKEL+'<title>Grille MCV E31 E32</title>\n'+HEAD_LINKS+'\n<style id="css">'+CSS_SRC+'</style>\n<div id="app-root"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+APP_SRC+'<\/script></body></html>';}
function download(name,text){try{var b=new Blob([text],{type:'text/html;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);}catch(e){toast('Téléchargement impossible dans ce navigateur.');}}
function slugName(){return String(S.classe||'classe').replace(/[^A-Za-z0-9]+/g,'_')+'_'+today();}
function save(){if(STANDALONE){autoLocal();if(!FSA){download('Grille_MCV_E31_E32_'+slugName()+'.html',buildFileDoc(S));ui.fileDirty=false;render();toast('Grille téléchargée : rouvrez ce fichier la prochaine fois');return;}
    if(!ui.fh){linkFile();return;}clearTimeout(fileT);writeFile(true).then(function(ok){render();toast(ok?'Enregistré dans « '+ui.fh.name+' »':'Écriture refusée : cliquez sur « Autoriser l\'enregistrement »');});return;}
  if(!artifactNS){toast('Enregistrement impossible ici : ouvrez la grille dans Claude avec votre compte.');return;}
  ui.publishing=true;updateSaveBar();
  var next=JSON.parse(JSON.stringify(S));next.updated=new Date().toISOString();
  ss('mcv-stash',JSON.stringify(next));
  artifactNS.publish(buildDoc(next)).then(function(){ss('mcv-stash',null);saved=JSON.parse(JSON.stringify(next));S=JSON.parse(JSON.stringify(next));ui.publishing=false;toast('Enregistré');render();},function(err){ui.publishing=false;var c=err&&err.code;
    if(c==='conflict'){toast('Une autre version vient d\'être enregistrée : la page se recharge, vos saisies restent récupérables.');}
    else if(c==='not_writer'||c==='not_granted'){ui.canEdit=false;toast('Vous pouvez consulter cette grille mais pas l\'enregistrer.');render();}
    else{toast('Échec de l\'enregistrement ('+(c||'erreur')+'). Réessayez dans un instant.');updateSaveBar();}});}
var toastT=null;
function toast(msg){var el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(function(){el.remove();},3800);}
window.addEventListener('beforeunload',function(ev){if(dirty())stashLocal();if(STANDALONE&&ui.canEdit&&ui.fileDirty){ev.preventDefault();ev.returnValue='';return '';}});

/* ---------- démarrage ---------- */
render();
if(STANDALONE){var raw=ls(LSKEY);if(raw&&!saved.readonly){try{var loc=JSON.parse(raw);if(loc&&loc.blocs&&(loc.updated||'')>(saved.updated||'')){loc.hist=loc.hist||{};loc.com=loc.com||{};saved=loc;S=JSON.parse(JSON.stringify(loc));}}catch(e){}}ui.canEdit=!saved.readonly;render();
  if(ui.canEdit&&FSA){idb('get').then(function(fh){if(fh&&fh.createWritable){ui.fh=fh;var q=fh.queryPermission?fh.queryPermission({mode:'readwrite'}):Promise.resolve('granted');q.then(function(p){ui.needPerm=(p!=='granted');render();}).catch(function(){ui.needPerm=true;render();});}});}}
function boot(tries){if(STANDALONE)return;
 if(!(window.claude&&window.claude.use)){if(tries<30)setTimeout(function(){boot(tries+1);},150);return;}
  Promise.all([window.claude.use('artifact').catch(function(){return null;}),window.claude.use('user').catch(function(){return null;})]).then(function(r){
    artifactNS=r[0];var user=r[1];
    var p=user&&user.canEdit?user.canEdit().catch(function(){return false;}):Promise.resolve(false);
    return p.then(function(ok){ui.canEdit=!!(ok&&artifactNS);render();});
  });
}
boot(0);
})();
</script>
